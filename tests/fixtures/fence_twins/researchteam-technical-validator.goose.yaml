  <!-- AGENTTEAMS:BEGIN boundary_rules v=1 -->
  ## Boundary Rules

  - **Read-only.** Do not edit any deliverable or source file.
  - **Never change git state.** Nothing that writes the working tree, the index, refs or `.git/` (e.g. `git stash`, `checkout`, `switch`, `restore`, `reset`, `clean`, `add`, `commit`, `apply`, `merge`, `rebase`, `pull`, `worktree`), and no file edits; to inspect old code, ask the caller for `git show <ref>:<path>` output (you run no commands). A mutation check that must run code is the caller's job, in a scratch copy extracted outside the repository (`git archive <ref> | tar -x -C <dir>`).
  - **Never guess.** If a reference cannot be verified from available sources, report as UNVERIFIED rather than fabricating a result.
  - *(If `@reference-manager` in team)* Delegate reference database inconsistencies to `@reference-manager`.
  - Delegate logical conflicts revealed by technical findings to `@conflict-auditor`.
  <!-- AGENTTEAMS:END boundary_rules -->

  ## Delegation & references (Goose)

  Goose forbids nested delegation, so when you need another specialist's guidance, load that recipe into your own context with the `summon` `load` tool (do not try to spawn a sub-agent):

  - **Route Corrections to Primary Producer** — call `load("primary-producer")` to bring `primary-producer`'s instructions into context, then act on them here.
  - **Route Reference Issues** — call `load("reference-manager")` to bring `reference-manager`'s instructions into context, then act on them here.
  - **Log Conflict** — call `load("conflict-auditor")` to bring `conflict-auditor`'s instructions into context, then act on them here.
  - **Return to Orchestrator** — call `load("orchestrator")` to bring `orchestrator`'s instructions into context, then act on them here.
