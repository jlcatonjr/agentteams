<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" font-family="Helvetica, Arial, sans-serif">
<title>vulnscan agent mode: trust boundaries</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="960" height="580" fill="#ffffff"/>
<rect x="12" y="8" width="312" height="564" rx="10" fill="#eef6ee" stroke="#bbbbbb"/>
<text x="28" y="32" font-size="16" font-weight="bold" fill="#222">Your account</text>
<text x="28" y="52" font-size="12" fill="#555">credentials, grants, ledger key</text>
<rect x="340" y="8" width="312" height="564" rx="10" fill="#e8eefb" stroke="#bbbbbb"/>
<text x="356" y="32" font-size="16" font-weight="bold" fill="#222">Agent container</text>
<text x="356" y="52" font-size="12" fill="#555">no credentials; internal network only</text>
<rect x="668" y="8" width="312" height="564" rx="10" fill="#fff8e8" stroke="#bbbbbb"/>
<text x="684" y="32" font-size="16" font-weight="bold" fill="#222">Outside</text>
<text x="684" y="52" font-size="12" fill="#555">reached only along the arrows</text>
<rect x="28" y="70" width="280" height="40" rx="6" fill="#ffffff" stroke="#3f8f4f" stroke-width="1.6"/>
<text x="168" y="94" font-size="13" text-anchor="middle" fill="#222">daily job (launchd / systemd / cron)</text>
<rect x="28" y="130" width="280" height="40" rx="6" fill="#ffffff" stroke="#3f8f4f" stroke-width="1.6"/>
<text x="168" y="154" font-size="13" text-anchor="middle" fill="#222">deterministic scan: OSV, runtimes, servers</text>
<rect x="28" y="190" width="280" height="40" rx="6" fill="#ffffff" stroke="#777777" stroke-width="1.6"/>
<text x="168" y="214" font-size="13" text-anchor="middle" fill="#222">run dir: summary.md / .json</text>
<rect x="28" y="300" width="280" height="56" rx="6" fill="#ffffff" stroke="#1b3fa0" stroke-width="1.6"/>
<text x="168" y="324" font-size="13" text-anchor="middle" fill="#222">executor</text>
<text x="168" y="340" font-size="13" text-anchor="middle" fill="#222">acts only under your signed grant</text>
<rect x="28" y="376" width="280" height="56" rx="6" fill="#ffffff" stroke="#aa3333" stroke-width="1.6"/>
<text x="168" y="400" font-size="13" text-anchor="middle" fill="#222">checked before every action:</text>
<text x="168" y="416" font-size="13" text-anchor="middle" fill="#222">grant, @security HALT, escalations</text>
<rect x="28" y="452" width="280" height="40" rx="6" fill="#ffffff" stroke="#aa3333" stroke-width="1.6"/>
<text x="168" y="476" font-size="13" text-anchor="middle" fill="#222">MAC-chained ledger</text>
<rect x="28" y="512" width="280" height="40" rx="6" fill="#ffffff" stroke="#3f8f4f" stroke-width="1.6"/>
<text x="168" y="536" font-size="13" text-anchor="middle" fill="#222">you: review, halts, resolve, say</text>
<rect x="356" y="70" width="280" height="56" rx="6" fill="#ffffff" stroke="#1b3fa0" stroke-width="1.6"/>
<text x="496" y="94" font-size="13" text-anchor="middle" fill="#222">goose orchestrator</text>
<text x="496" y="110" font-size="13" text-anchor="middle" fill="#222">+ vuln-remediation agent</text>
<rect x="356" y="150" width="280" height="40" rx="6" fill="#ffffff" stroke="#1b3fa0" stroke-width="1.6"/>
<text x="496" y="174" font-size="13" text-anchor="middle" fill="#222">vulnscan MCP server (its only tools)</text>
<rect x="356" y="220" width="280" height="56" rx="6" fill="#ffffff" stroke="#777777" stroke-width="1.6"/>
<text x="496" y="244" font-size="13" text-anchor="middle" fill="#222">request spool</text>
<text x="496" y="260" font-size="13" text-anchor="middle" fill="#222">(writable; so are the goose sessions)</text>
<rect x="356" y="470" width="280" height="56" rx="6" fill="#ffffff" stroke="#1b3fa0" stroke-width="1.6"/>
<text x="496" y="494" font-size="13" text-anchor="middle" fill="#222">egress gateway sidecar</text>
<text x="496" y="510" font-size="13" text-anchor="middle" fill="#222">one model, spend cap, holds the API key</text>
<rect x="684" y="290" width="260" height="56" rx="6" fill="#ffffff" stroke="#ccaa44" stroke-width="1.6"/>
<text x="814" y="314" font-size="13" text-anchor="middle" fill="#222">GitHub: new vulnscan/* branch</text>
<text x="814" y="330" font-size="13" text-anchor="middle" fill="#222">and pull request (never merged)</text>
<rect x="684" y="360" width="260" height="40" rx="6" fill="#ffffff" stroke="#ccaa44" stroke-width="1.6"/>
<text x="814" y="384" font-size="13" text-anchor="middle" fill="#222">servers: read-only audit, dry run</text>
<rect x="684" y="415" width="260" height="50" rx="6" fill="#ffffff" stroke="#ccaa44" stroke-width="1.6"/>
<text x="814" y="436" font-size="13" text-anchor="middle" fill="#222">private ops repo: reports</text>
<text x="814" y="452" font-size="13" text-anchor="middle" fill="#222">(only with a publish grant)</text>
<rect x="684" y="485" width="260" height="46" rx="6" fill="#ffffff" stroke="#ccaa44" stroke-width="1.6"/>
<text x="814" y="504" font-size="13" text-anchor="middle" fill="#222">model API</text>
<text x="814" y="520" font-size="13" text-anchor="middle" fill="#222">(OpenRouter or your route proxy)</text>
