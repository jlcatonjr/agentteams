<polyline points="308,348 684,440" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="636,98 652,98 652,498 636,498" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
