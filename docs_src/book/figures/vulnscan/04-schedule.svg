<svg xmlns="http://www.w3.org/2000/svg" width="808" height="498" viewBox="0 0 808 498" role="img">
<title>Step 3 — install the daily job (dry run)</title>
<rect width="808" height="498" rx="8" fill="#1e1f24"/>
<rect width="808" height="26" rx="8" fill="#2c2e35"/>
<rect y="18" width="808" height="8" fill="#2c2e35"/>
<circle cx="16" cy="13" r="5" fill="#ff5f57"/><circle cx="34" cy="13" r="5" fill="#febc2e"/><circle cx="52" cy="13" r="5" fill="#28c840"/>
<text x="404" y="17" fill="#a9adb7" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="middle">Step 3 — install the daily job (dry run)</text>
<text x="14" y="52" fill="#8fd18f" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">$ python -m agentteams.vulnscan schedule install</text>
<text x="14" y="69" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">WRITE ~/Library/LaunchAgents/io.agentteams.vulnscan.plist</text>
<text x="14" y="86" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">&lt;?xml version="1.0" encoding="UTF-8"?&gt;</text>
<text x="14" y="103" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">&lt;!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd</text>
<text x="14" y="120" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    "&gt;</text>
<text x="14" y="137" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">&lt;plist version="1.0"&gt;</text>
<text x="14" y="154" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">&lt;dict&gt;</text>
<text x="14" y="171" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">  &lt;key&gt;Label&lt;/key&gt;&lt;string&gt;io.agentteams.vulnscan&lt;/string&gt;</text>
<text x="14" y="188" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">  &lt;key&gt;ProgramArguments&lt;/key&gt;</text>
<text x="14" y="205" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">  &lt;array&gt;</text>
<text x="14" y="222" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    &lt;string&gt;&lt;python&gt;&lt;/string&gt;</text>
<text x="14" y="239" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    &lt;string&gt;-m&lt;/string&gt;</text>
<text x="14" y="256" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    &lt;string&gt;agentteams.vulnscan&lt;/string&gt;</text>
<text x="14" y="273" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    &lt;string&gt;daily&lt;/string&gt;</text>
<text x="14" y="290" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">  &lt;/array&gt;</text>
<text x="14" y="307" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">  &lt;key&gt;StartCalendarInterval&lt;/key&gt;</text>
<text x="14" y="324" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">  &lt;dict&gt;&lt;key&gt;Hour&lt;/key&gt;&lt;integer&gt;7&lt;/integer&gt;&lt;key&gt;Minute&lt;/key&gt;&lt;integer&gt;30&lt;/integer&gt;&lt;/dict&gt;</text>
<text x="14" y="341" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">  &lt;key&gt;EnvironmentVariables&lt;/key&gt;</text>
<text x="14" y="358" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">  &lt;dict&gt;</text>
<text x="14" y="375" fill="#7f8594" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">[… 21 more lines not shown]</text>
<text x="14" y="392" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">&lt;/dict&gt;</text>
<text x="14" y="409" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">&lt;/plist&gt;</text>
<text x="14" y="426" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve"></text>
<text x="14" y="443" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">WOULD RUN launchctl bootout gui/&lt;uid&gt;/io.agentteams.vulnscan</text>
<text x="14" y="460" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">WOULD RUN launchctl bootstrap gui/&lt;uid&gt; ~/Library/LaunchAgents/io.agentteams.vulnscan.plist</text>
<text x="14" y="477" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">dry run — re-run with --apply</text>
</svg>
