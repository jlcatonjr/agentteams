<svg xmlns="http://www.w3.org/2000/svg" width="808" height="192" viewBox="0 0 808 192" role="img">
<title>Step 2 — export the server kit</title>
<rect width="808" height="192" rx="8" fill="#1e1f24"/>
<rect width="808" height="26" rx="8" fill="#2c2e35"/>
<rect y="18" width="808" height="8" fill="#2c2e35"/>
<circle cx="16" cy="13" r="5" fill="#ff5f57"/><circle cx="34" cy="13" r="5" fill="#febc2e"/><circle cx="52" cy="13" r="5" fill="#28c840"/>
<text x="404" y="17" fill="#a9adb7" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="middle">Step 2 — export the server kit</text>
<text x="14" y="52" fill="#8fd18f" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">$ python -m agentteams.vulnscan server-kit</text>
<text x="14" y="69" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">server kit in ~/.config/agentteams/server-kit: L1-audit.sh, L2-os-patch.sh, L3-node-runtime.sh, L4-p</text>
<text x="14" y="86" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    ython-app.sh, L5-containers.sh, apps.conf, apps.conf.example, hosts.conf, hosts.conf.example, io</text>
<text x="14" y="103" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    c-2026-10-litellm-1.107.0.txt, remote.sh, run-host.sh</text>
<text x="14" y="120" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">Edit ~/.config/agentteams/server-kit/hosts.conf and ~/.config/agentteams/server-kit/apps.conf, then:</text>
<text x="14" y="137" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">     ~/.config/agentteams/server-kit/remote.sh all L1-audit.sh</text>
<text x="14" y="154" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">vulnscan: no daily run has completed yet — run `python -m agentteams.vulnscan daily` or `schedule in</text>
<text x="14" y="171" fill="#e6e6e6" font-family="Menlo, Consolas, monospace" font-size="13" xml:space="preserve">    stall`</text>
</svg>
