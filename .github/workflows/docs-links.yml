name: Docs External Links (Weekly)

# Requests every external link on the published docs pages once a week. Only definite breakage fails
# the run (HTTP 404/410, or a host that does not resolve); rate limits and timeouts are reported as
# unverified. A failed run is the signal to fix or replace the link. See scripts/check_docs_site.py.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned docs toolchain
        run: pip install -r .github/docs-requirements.txt

      - name: Build docs
        run: mkdocs build --strict --site-dir _site

      - name: Check external links
        run: python scripts/check_docs_site.py external _site
