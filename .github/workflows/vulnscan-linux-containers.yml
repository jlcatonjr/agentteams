name: vulnscan Linux containers

# R4 (rc.5): agent mode on Linux Docker Engine. The unit tests mock `docker info`; this job is the real test.
# On a rootful Engine (GitHub's ubuntu runners) the agent, gateway and self-test containers run as the
# operator's uid:gid (agentteams/vulnscan/docker_mode.py), so the gateway must read the 0600 key file and the
# DLP context, and the agent must write the spool and its session state, through plain bind mounts.
#
# It builds the tools image and the goose agent image with the repository's own scripts (every download
# checked against the pins), then runs both self-tests. The model upstream is a local stub; the key file holds
# a placeholder, never a real key. The goose self-test makes no model call.

on:
  pull_request:
    paths:
      - "agentteams/vulnscan/**"
      - "agentteams/data/vulnscan_agent/**"
      - "agentteams/data/vulnscan_tools/**"
      - "scripts/vulnscan-agent-image.sh"
      - "scripts/vulnscan-tools-image.sh"
      - ".github/workflows/vulnscan-linux-containers.yml"
  push:
    branches:
      - main
    paths:
      - "agentteams/vulnscan/**"
      - "agentteams/data/vulnscan_agent/**"
      - "agentteams/data/vulnscan_tools/**"
      - "scripts/vulnscan-agent-image.sh"
      - "scripts/vulnscan-tools-image.sh"
      - ".github/workflows/vulnscan-linux-containers.yml"
  workflow_dispatch:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

concurrency:
  group: vulnscan-linux-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-containers:
    runs-on: ubuntu-latest   # rootful Docker Engine
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install agentteams
        run: pip install -e .

      - name: Scratch config and state dirs
        run: |
          base="$RUNNER_TEMP/vulnscan"
          mkdir -p "$base"
          {
            echo "AGENTTEAMS_VULNSCAN_CONFIG_DIR=$base/cfg"
            echo "AGENTTEAMS_VULNSCAN_STATE_DIR=$base/state"
            echo "VULNSCAN_BASE=$base"
            echo "VULNSCAN_PY=$(command -v python)"
          } >> "$GITHUB_ENV"

      - name: Docker mode is a rootful Engine, run as this account
        run: |
          python - <<'EOF'
          import os
          from agentteams.vulnscan import docker_mode
          mode = docker_mode.detect()
          print(f"docker mode: {mode.name}, container user: {mode.user}")
          assert mode.name == docker_mode.ROOTFUL and not mode.problem, mode
          assert mode.user == f"{os.getuid()}:{os.getgid()}", mode
          EOF

      - name: Start the stub upstream
        run: |
          cat > "$VULNSCAN_BASE/stub.py" <<'EOF'
          """A stand-in model upstream: answers every request with an empty JSON object. No real provider."""
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Stub(BaseHTTPRequestHandler):
              def _reply(self):
                  body = b"{}"
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              do_GET = do_POST = _reply

          ThreadingHTTPServer(("0.0.0.0", 8791), Stub).serve_forever()
          EOF
          nohup python "$VULNSCAN_BASE/stub.py" > "$VULNSCAN_BASE/stub.log" 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8791/ > /dev/null

      - name: Configure agent mode (placeholder key, scratch team dir)
        run: |
          python -m agentteams.vulnscan init
          python - <<'EOF'
          import json, os
          from pathlib import Path
          from agentteams.vulnscan import paths

          base = Path(os.environ["VULNSCAN_BASE"])
          team = base / "team"
          (team / ".goose" / "recipes").mkdir(parents=True, exist_ok=True)
          os.chmod(team, 0o755)
          (team / ".goose" / "recipes" / "vuln-remediation.yaml").write_text(
              'version: "1.0.0"\n'
              "title: Vulnerability remediation\n"
              "description: CI stand-in for the team's remediation recipe\n"
              "instructions: Follow the Daily Remediation workflow with the vulnscan tools.\n"
              "extensions:\n"
              "  - type: stdio\n"
              "    name: vulnscan\n"
              "    cmd: python\n"
              "    args: [\"-m\", \"agentteams.vulnscan.mcp\"]\n"
              "    timeout: 300\n")
          key = base / "keys" / "openrouter.env"
          key.parent.mkdir(mode=0o700, exist_ok=True)
          key.write_text("OPENROUTER_API_KEY=ci-placeholder-not-a-key\n")
          os.chmod(key, 0o600)   # as an operator's key file: readable by its owner only
          cfg = json.loads(paths.config_file().read_text())
          cfg["agent"].update(enabled=True, team_dir=str(team), key_file=str(key),
                              upstream="http://host.docker.internal:8791")
          paths.config_file().write_text(json.dumps(cfg, indent=2))
          EOF

      - name: Tools image and tools-selftest
        run: bash scripts/vulnscan-tools-image.sh

      - name: goose agent image and agent-selftest
        env:
          GH_TOKEN: ${{ github.token }}   # read-only: the release-digest lookup in the image script
        run: FRAMEWORK=goose bash scripts/vulnscan-agent-image.sh

      - name: The self-test ran as this account and passed
        run: |
          python - <<'EOF'
          import json, os
          from agentteams.vulnscan import paths
          rec = json.loads((paths.state_dir() / "agent-selftest.json").read_text())
          print(json.dumps({k: rec.get(k) for k in ("passed", "docker_mode", "container_user", "checks")}, indent=2))
          assert rec["passed"] and rec["docker_mode"] == "rootful", rec.get("checks")
          assert rec["container_user"] == f"{os.getuid()}:{os.getgid()}"
          EOF

      - name: Diagnostics
        if: failure()
        run: |
          cat "$AGENTTEAMS_VULNSCAN_STATE_DIR/agent-selftest.json" || true
          cat "$AGENTTEAMS_VULNSCAN_STATE_DIR/tools-selftest.json" || true
          cat "$VULNSCAN_BASE/stub.log" || true
          docker ps -a || true
