name: Daily AgentTeams Bridge Maintenance

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-bridge-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Run daily bridge maintenance (autonomous)
        run: bash scripts/run_daily_bridge_maintenance.sh

      - name: Upload bridge maintenance summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bridge-maintenance-summary
          path: |
            tmp/bridge-maintenance/
            tmp/daily-pipeline/
          if-no-files-found: warn
