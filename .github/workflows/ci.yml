name: CI

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  # CI-cost plan (2026-11-04, references/plans/ci-cost-branching-strategy.report.md): PR CI runs for PRs into
  # main and release lines (the dev → main release PR, hotfixes, backports) and into `dev`, which only invited
  # contributors' fork PRs and automation PRs (vulnscan fixes) target. The maintainer's own feature work merges locally into `dev` behind the local
  # gate, with no PR, so it triggers nothing. Never add `dev` to `push`, and never a '**' trigger (pinned by
  # tests/test_branch_model.py).
  pull_request:
    branches: [main, dev, "release/**"]
  # rc.5: workflow_dispatch is exempt from the GITHUB_TOKEN infinite-loop
  # safeguard, so framework-auto-update.yml can dispatch CI on the
  # auto-merge commit and restore the rc.4 post-merge safety-net claim.
  workflow_dispatch:

# Least privilege for every job (follow-up #5, @security C7): no job needs to write.
permissions:
  contents: read

# A new push to a PR cancels that PR's superseded run (it would only be billed and discarded). Every other event
# gets a group of its own (the run id): GitHub also cancels a *pending* run when a newer one joins its group, so
# a shared group would drop verdicts on main, release lines and tags. The watcher workflows keep their own
# "no cancel-in-progress" rule; this applies to ci.yml only.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: GitHub moved ubuntu-latest to Ubuntu 26 from 2026-10-19, where the
        # confinement tests' expectations (EPERM wording, survivor reporting, GNU coreutils) don't hold yet.
        # Ubuntu 26 support is a 1.0.2 must-fix; move back to ubuntu-latest with it.
        # macOS runs where it decides a merge (the PR, a tag, a manual dispatch), not again on the push that
        # merges an already-tested PR: macOS minutes bill at a multiple of Linux minutes on private repos.
        os: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "macos-latest"]') }}
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify environment preconditions
        run: python scripts/verify-env.py

      - name: Install package and pytest
        run: pip install -e ".[test,research]"

      - name: Run tests
        run: pytest tests/

      # The full suite above installs the package EDITABLE, where source `schemas/`
      # is always on the path — which is exactly why the rc6 wheel shipping zero
      # schema files went undetected until it broke retrieval in the field. This
      # explicit gate builds a real wheel and asserts the JSON schemas are inside
      # it, so an editable-only suite can never hide a package-data regression again.
      - name: Wheel packaging smoke — JSON schemas must ship in the built wheel
        run: pytest tests/test_packaging_schemas.py -v

      - name: Generate man-page for comparison
        run: python -m agentteams.man > /tmp/agentteams-check.1

      - name: Check man-page is current
        run: diff /tmp/agentteams-check.1 agentteams.1

      - name: Lint — durable artifacts must not cite gitignored tmp/ paths (RSR1)
        if: runner.os == 'Linux'
        run: bash scripts/check-durable-tmp-refs.sh

  # Docs site guard (docs-site restructure, Phase 0). Builds the site strictly on every PR and push, so a
  # broken link or nav entry fails before merge rather than in docs.yml after it. Then runs the
  # stdlib checks in scripts/check_docs_site.py: per-page accessibility checks, every URL cited in
  # README/man page/pyproject still resolving, and every page URL of the base build still existing
  # (deliberate removals go in .github/docs-removed-urls.txt).
  docs-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false  # this job never pushes; keep the token out of .git/config

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # same as docs.yml, so the PR check builds like the deploy

      - name: Install pinned docs toolchain
        run: pip install -r .github/docs-requirements.txt

      - name: Build docs (strict)
        run: mkdocs build --strict --site-dir _site

      - name: Page checks (titles, skip link, alt text, headings, link text)
        run: python scripts/check_docs_site.py pages _site

      - name: Inbound URLs resolve
        run: python scripts/check_docs_site.py inbound _site

      - name: Resolve the base ref to compare against
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
                 || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                # New branch or force-push: compare against where this branch left main.
                base="$(git merge-base HEAD origin/main)"
              else
                base="$BEFORE"
              fi ;;
            *) base="$(git rev-parse HEAD^)" ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Resolved base '$base' is not a commit SHA."; exit 1; }
          echo "Comparing against $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Build the base ref's site (non-strict; the base may predate the strict gate)
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          if ! (cd "$RUNNER_TEMP/base" && mkdocs build --site-dir "$RUNNER_TEMP/base-site"); then
            echo "::error::The base ref $BASE does not build, so URL preservation cannot be checked."
            exit 1
          fi

      - name: No published URL disappears unless allowlisted
        run: python scripts/check_docs_site.py urls "$RUNNER_TEMP/base-site" _site --allowlist .github/docs-removed-urls.txt

  # The fence-twin lineage corpus (agentteams/data/template_lineage.json) is deletion authority
  # (Rule 12). The test job above is a shallow clone, so this job runs the lineage tests with full
  # public history: entries citing public commits are checked against git, and entries citing the
  # archived pre-public history (not on origin, so unreadable here) must match the digest pinned in
  # tests/test_template_lineage.py. Full regeneration runs only where that archive is present.
  template-lineage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and pytest
        run: pip install -e ".[test]"

      - name: Lineage corpus provenance and regeneration
        run: pytest tests/test_template_lineage.py -v

  # Live WASM tests on Linux (WASM follow-up F2): the `test` matrix never installs wasmtime, so every live WASM test
  # skips there. This job installs bubblewrap and the pinned runtimes, then runs the live tests with wasmtime nested
  # under bwrap (os_confinement=nested, nested:bwrap). A skip guard fails the job if any test skips outside the
  # allowlist below, so a missing precondition cannot leave it green for nothing. ubuntu-24.04 for the same reason as
  # the test matrix. BLOCKING since 2026-11-05 (remediation row wasm-live-job-required; green on #367, #381 and main),
  # so a red result fails the run.
  wasm-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # the project target

      - name: Install package and pytest
        run: pip install -e ".[test]"

      - name: Install bubblewrap
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap

      # Ubuntu 23.10+ can restrict unprivileged user namespaces through AppArmor, which bwrap needs. Probe with the
      # exact _sandbox_profiles.available() command. On failure, first apply the remedy a stock-Ubuntu user would
      # (an unconfined bwrap profile that allows userns, as in scripts/test-sandbox-apparmor-userns.sh), and only
      # if that fails relax the sysctl. Either remedy is a warning, and the outcome goes in the step summary.
      - name: bwrap probe (AppArmor user-namespace restriction)
        run: |
          probe() { bwrap --ro-bind / / --dev /dev --unshare-pid --die-with-parent true; }
          knob="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          echo "kernel.apparmor_restrict_unprivileged_userns = $knob"
          remedy=none
          if ! probe; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' \
              '  include if exists <local/bwrap>' '}' \
              | sudo tee /etc/apparmor.d/bwrap >/dev/null
            if sudo apparmor_parser -r /etc/apparmor.d/bwrap && probe; then
              remedy="AppArmor profile /etc/apparmor.d/bwrap (userns)"
            else
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              remedy="sysctl kernel.apparmor_restrict_unprivileged_userns=0 (the profile was not enough)"
              probe || { echo "::error::bwrap still cannot start after both remedies"; exit 1; }
            fi
            echo "::warning::bwrap needed a remedy on this runner: $remedy"
          fi
          { echo "### bwrap / AppArmor"
            echo "- kernel.apparmor_restrict_unprivileged_userns: $knob"
            echo "- remedy: $remedy"; } >> "$GITHUB_STEP_SUMMARY"

      # The install refuses a missing project root (wasm_runtime._check_project_root).
      - name: Install the pinned WASM runtimes into a scratch project
        run: |
          mkdir -p "$RUNNER_TEMP/wasm-proj"
          python build_team.py --wasm-install all --project "$RUNNER_TEMP/wasm-proj" --yes
          python build_team.py --wasm-status --project "$RUNNER_TEMP/wasm-proj"
          python scripts/wasm_live_ci.py env "$RUNNER_TEMP/wasm-proj" | tee -a "$GITHUB_ENV"

      # Without a usable OS sandbox every nested test would skip (or run unnested) and prove nothing.
      - name: Precondition — bwrap is usable for nesting
        run: |
          got="$(python -c 'from agentteams import _sandbox_profiles as SP; print(SP.available())')"
          echo "_sandbox_profiles.available() = $got"
          [ "$got" = "bwrap" ]

      # The file list and the skip allowlists live in scripts/wasm_live_ci.py (LIVE_FILES, COMMON_ALLOW,
      # SANDBOX_ALLOW), shared with the macos-seatbelt job. The nested network-deny and credential-deny cases run here
      # under bwrap too, so the Linux claim covers R5 deny_reads and network deny, not only nesting.
      - name: Live WASM tests (nested under bwrap)
        id: live
        run: |
          # shellcheck disable=SC2046  # the file list is space-separated on purpose
          pytest -v -rs --junitxml="$RUNNER_TEMP/wasm-live.xml" $(python scripts/wasm_live_ci.py files) \
            tests/test_os_sandbox_enforcement.py::test_bwrap_unbound_path_is_unreadable

      - name: Skip guard — no unexplained skips
        if: success() || steps.live.outcome == 'failure'  # also after failing tests, but not when they never ran
        run: |
          python scripts/wasm_live_ci.py skips "$RUNNER_TEMP/wasm-live.xml" --sandbox bwrap

      - name: R13 full-step timing (logged, not gated)
        run: python scripts/wasm_live_ci.py timing "$RUNNER_TEMP/wasm-proj" --expect-reason nested:bwrap

  # Follow-up #5 (2026-09-30): the goose Seatbelt profile under the REAL sandbox-exec on an unnested
  # macOS runner, plus the macOS launcher gate. BLOCKING since 2026-11-05 (remediation rows
  # macos-seatbelt-job-required and wasm-live-job-required): a red result fails the run.
  # WASM follow-up F2 adds the live WASM tests here too: sandbox-exec runs unnested on this runner, so wasmtime
  # nests under Seatbelt (nested:seatbelt), with the same skip guard as the wasm-live job.
  macos-seatbelt:
    runs-on: macos-latest
    # Same macOS rule as the test matrix: skipped on a branch push (the merged PR already ran it).
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and pytest
        run: pip install -e ".[test]"

      - name: Goose Seatbelt mechanism probes (sandbox-exec)
        env:
          RUN_GOOSE_SEATBELT_PROBES: "1"
        run: pytest -v tests/test_goose_seatbelt_mechanism.py tests/test_os_sandbox_enforcement.py tests/test_confinement.py

      - name: macOS launcher gate (mac-escape-tests.sh)
        run: |
          d="$HOME/agentteams-mac-gate"; mkdir -p "$d"
          cp agentteams/templates/universal/sandbox/confine-run.sh agentteams/templates/universal/sandbox/mac-escape-tests.sh "$d/"
          chmod +x "$d"/*.sh
          bash "$d/mac-escape-tests.sh" | tee "$d/out.txt" || true
          pass=$(grep -c '^  PASS' "$d/out.txt" || true)
          bad=$(grep -Ec '^  (UNTRUSTED|INDETERMINATE|FAIL)' "$d/out.txt" || true)
          echo "PASS=$pass UNTRUSTED/INDETERMINATE/FAIL=$bad"
          # the egress gate needs network and may be INDETERMINATE: reported, not required
          [ "$pass" -gt 0 ] && [ "$(grep -E '^  (UNTRUSTED|INDETERMINATE|FAIL)' "$d/out.txt" | grep -vic egress || true)" -eq 0 ]

      - name: Install the pinned WASM runtimes into a scratch project
        if: ${{ !cancelled() }}  # run even when the launcher gate above is red
        run: |
          mkdir -p "$RUNNER_TEMP/wasm-proj"
          python build_team.py --wasm-install all --project "$RUNNER_TEMP/wasm-proj" --yes
          python build_team.py --wasm-status --project "$RUNNER_TEMP/wasm-proj"
          python scripts/wasm_live_ci.py env "$RUNNER_TEMP/wasm-proj" | tee -a "$GITHUB_ENV"

      - name: Precondition — Seatbelt is usable for nesting
        if: ${{ !cancelled() }}  # run even when the launcher gate above is red
        run: |
          got="$(python -c 'from agentteams import _sandbox_profiles as SP; print(SP.available())')"
          echo "_sandbox_profiles.available() = $got"
          [ "$got" = "seatbelt" ]

      # ~/.ssh must exist, or test_nested_credential_store_unreadable skips. Same file list and common allowlist
      # as the wasm-live job (scripts/wasm_live_ci.py); the deny cases must run here too.
      - name: Live WASM tests (nested under Seatbelt)
        if: ${{ !cancelled() }}  # run even when the launcher gate above is red
        id: live
        run: |
          mkdir -p ~/.ssh
          # shellcheck disable=SC2046  # the file list is space-separated on purpose
          pytest -v -rs --junitxml="$RUNNER_TEMP/wasm-live.xml" $(python scripts/wasm_live_ci.py files)

      - name: Skip guard — no unexplained skips
        if: ${{ !cancelled() && (steps.live.outcome == 'success' || steps.live.outcome == 'failure') }}
        run: |
          python scripts/wasm_live_ci.py skips "$RUNNER_TEMP/wasm-live.xml" --sandbox seatbelt

      - name: R13 full-step timing (logged, not gated)
        if: ${{ !cancelled() && steps.live.outcome == 'success' }}
        run: python scripts/wasm_live_ci.py timing "$RUNNER_TEMP/wasm-proj" --expect-reason nested:seatbelt
