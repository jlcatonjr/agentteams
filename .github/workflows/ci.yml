name: CI

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  pull_request:
  # rc.5: workflow_dispatch is exempt from the GITHUB_TOKEN infinite-loop
  # safeguard, so framework-auto-update.yml can dispatch CI on the
  # auto-merge commit and restore the rc.4 post-merge safety-net claim.
  workflow_dispatch:

# Least privilege for every job (follow-up #5, @security C7): no job needs to write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # TEMPORARY (#262 verification): both Ubuntu images while the fix is checked; the final commit keeps
        # ubuntu-latest only (Ubuntu 26, where bwrap is usable and the live confinement tests actually run).
        os: [ubuntu-24.04, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify environment preconditions
        run: python scripts/verify-env.py

      - name: Install package and pytest
        run: pip install -e ".[test,research]"

      # TEMPORARY (#262 verification): say which OS sandbox this runner has, so a skipped live suite is visible.
      - name: Report the OS sandbox
        run: python -c "from agentteams import confinement as C; print('::notice title=sandbox::' + str(C.available()))"

      - name: Run tests
        run: pytest tests/ -rs --junitxml=pytest-results.xml

      # TEMPORARY (#262 verification): failed tests as annotations, readable from the public check-runs API.
      - name: Annotate failed tests
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for tc in ET.parse("pytest-results.xml").iter("testcase"):
              for f in list(tc.findall("failure")) + list(tc.findall("error")):
                  msg = (f.get("message") or "").replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900]
                  print(f"::error title={tc.get('classname')}.{tc.get('name')}::{msg}")
          PY

      # The full suite above installs the package EDITABLE, where source `schemas/`
      # is always on the path — which is exactly why the rc6 wheel shipping zero
      # schema files went undetected until it broke retrieval in the field. This
      # explicit gate builds a real wheel and asserts the JSON schemas are inside
      # it, so an editable-only suite can never hide a package-data regression again.
      - name: Wheel packaging smoke — JSON schemas must ship in the built wheel
        run: pytest tests/test_packaging_schemas.py -v

      - name: Generate man-page for comparison
        run: python -m agentteams.man > /tmp/agentteams-check.1

      - name: Check man-page is current
        run: diff /tmp/agentteams-check.1 agentteams.1

      - name: Lint — durable artifacts must not cite gitignored tmp/ paths (RSR1)
        if: runner.os == 'Linux'
        run: bash scripts/check-durable-tmp-refs.sh

  # The fence-twin lineage corpus (agentteams/data/template_lineage.json) is deletion authority
  # (Rule 12). The test job above is a shallow clone, so this job runs the lineage tests with full
  # public history: entries citing public commits are checked against git, and entries citing the
  # archived pre-public history (not on origin, so unreadable here) must match the digest pinned in
  # tests/test_template_lineage.py. Full regeneration runs only where that archive is present.
  template-lineage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and pytest
        run: pip install -e ".[test]"

      - name: Lineage corpus provenance and regeneration
        run: pytest tests/test_template_lineage.py -v

  # Follow-up #5 (2026-09-30): the goose Seatbelt profile under the REAL sandbox-exec on an unnested
  # macOS runner, plus the macOS launcher gate. ADVISORY until 2026-10-14 (remediation row
  # macos-seatbelt-job-required): a red result is visible but does not block merges yet.
  macos-seatbelt:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and pytest
        run: pip install -e ".[test]"

      - name: Goose Seatbelt mechanism probes (sandbox-exec)
        env:
          RUN_GOOSE_SEATBELT_PROBES: "1"
        run: pytest -v tests/test_goose_seatbelt_mechanism.py tests/test_os_sandbox_enforcement.py tests/test_confinement.py

      - name: macOS launcher gate (mac-escape-tests.sh)
        run: |
          d="$HOME/agentteams-mac-gate"; mkdir -p "$d"
          cp agentteams/templates/universal/sandbox/confine-run.sh agentteams/templates/universal/sandbox/mac-escape-tests.sh "$d/"
          chmod +x "$d"/*.sh
          bash "$d/mac-escape-tests.sh" | tee "$d/out.txt" || true
          pass=$(grep -c '^  PASS' "$d/out.txt" || true)
          bad=$(grep -Ec '^  (UNTRUSTED|INDETERMINATE|FAIL)' "$d/out.txt" || true)
          echo "PASS=$pass UNTRUSTED/INDETERMINATE/FAIL=$bad"
          # the egress gate needs network and may be INDETERMINATE: reported, not required
          [ "$pass" -gt 0 ] && [ "$(grep -E '^  (UNTRUSTED|INDETERMINATE|FAIL)' "$d/out.txt" | grep -vic egress || true)" -eq 0 ]
