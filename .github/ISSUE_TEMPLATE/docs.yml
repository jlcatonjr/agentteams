name: Documentation problem
description: A page is wrong, unclear, out of date or broken.
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page, or the file under docs_src/.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the passage if you can.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording (optional)
